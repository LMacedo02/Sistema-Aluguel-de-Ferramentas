<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AlugaTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #2a7ae4 0%, #1e5bb8 100% );
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .brand-logo {
            color: #2a7ae4;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .btn-primary {
            background-color: #2a7ae4;
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #1e5bb8;
        }
        .form-control {
            padding: 12px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="/home" class="brand-logo">
            <i class="fas fa-tools me-2"></i>ALUGATECH
        </a>
        
        <h4 class="text-center mb-4 text-secondary">Bem-vindo de volta!</h4>

        <!-- Mensagem de erro caso o login falhe -->
        <div th:if="${param.error}" class="alert alert-danger text-center small">
            Usuário ou senha inválidos.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="Digite seu usuário" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="fas fa-sign-in-alt me-2"></i>Entrar
            </button>
        </form>

        <div class="text-center">
            <p class="small text-muted mb-0">Não tem uma conta?</p>
            <a href="/cadastro" class="text-decoration-none fw-bold">Criar conta agora</a>
        </div>
    </div>

</body>
</html>
