<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sucesso - AlugaTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .success-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1 ); text-align: center; max-width: 500px; }
        .icon-box { color: #198754; font-size: 5rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-box"><i class="fas fa-check-circle"></i></div>
        <h2 class="fw-bold mb-3">Pedido Realizado!</h2>
        <p class="text-muted mb-4">Seu aluguel da ferramenta <strong th:text="${aluguel.ferramenta.nome}"></strong> foi processado com sucesso.</p>
        
        <div class="alert alert-secondary mb-4">
            Valor Total: <strong th:text="'R$ ' + ${aluguel.valorTotal}"></strong>
        </div>

        <div class="d-grid gap-2">
            <!-- OPÇÃO DE ALUGAR MAIS -->
            <a href="/catalogo" class="btn btn-primary btn-lg fw-bold">
                <i class="fas fa-plus-circle me-2"></i>Deseja alugar algo mais?
            </a>
            <a href="/home" class="btn btn-outline-secondary">Voltar para Home</a>
        </div>
    </div>
</body>
</html>
