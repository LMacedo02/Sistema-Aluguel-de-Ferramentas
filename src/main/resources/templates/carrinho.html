<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - AlugaTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .item-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #eee; }
        .price-total { font-size: 1.5rem; font-weight: bold; color: #2a7ae4; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home"><i class="fas fa-tools me-2"></i>ALUGATECH</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/catalogo">Catálogo</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="fw-bold mb-4"><i class="fas fa-shopping-cart me-2"></i>Seu Carrinho</h2>

    <div th:if="${#lists.isEmpty(itens )}" class="text-center py-5">
        <i class="fas fa-cart-arrow-down fa-4x text-muted mb-3"></i>
        <h4 class="text-muted">Seu carrinho está vazio.</h4>
        <a href="/catalogo" class="btn btn-primary mt-3">Voltar ao Catálogo</a>
    </div>

    <div th:if="${!#lists.isEmpty(itens)}" class="row">
        <div class="col-lg-8">
            <div th:each="item, iter : ${itens}" class="item-card shadow-sm">
                <div class="row align-items-center">
                    <div class="col-2"><img th:src="@{${item.ferramenta.imagemUrl}}" class="img-fluid rounded"></div>
                    <div class="col-4">
                        <h6 class="fw-bold mb-0" th:text="${item.ferramenta.nome}"></h6>
                        <small class="text-muted" th:text="${item.ferramenta.descricao}"></small>
                    </div>
                    <div class="col-2 text-center">
                        <small class="text-muted d-block">Dias</small>
                        <strong th:text="${item.dias}"></strong>
                    </div>
                    <div class="col-3 text-end">
                        <small class="text-muted d-block">Subtotal</small>
                        <strong class="text-primary">R$ <span th:text="${#numbers.formatDecimal(item.subtotalBruto, 1, 'POINT', 2, 'COMMA')}"></span></strong>
                    </div>
                    <div class="col-1 text-end">
                        <a th:href="@{/carrinho/remover/{index}(index=${iter.index})}" class="text-danger"><i class="fas fa-trash"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <h5 class="fw-bold mb-4">Resumo do Pedido</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal:</span>
                    <span class="fw-bold">R$ <span th:text="${#numbers.formatDecimal(subtotalGeral, 1, 'POINT', 2, 'COMMA')}"></span></span>
                </div>
                <div class="d-flex justify-content-between mb-2 text-success">
                    <span>Desconto (5%):</span>
                    <span>- R$ <span th:text="${#numbers.formatDecimal(descontoGeral, 1, 'POINT', 2, 'COMMA')}"></span></span>
                </div>
                <hr>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <span class="fw-bold">Total:</span>
                    <span class="price-total">R$ <span th:text="${#numbers.formatDecimal(totalGeral, 1, 'POINT', 2, 'COMMA')}"></span></span>
                </div>
                
                <form th:action="@{/carrinho/finalizar}" method="post">
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold py-3">Finalizar Compra</button>
                </form>

                <a href="/catalogo" class="btn btn-link w-100 mt-2 text-muted">Continuar Comprando</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
