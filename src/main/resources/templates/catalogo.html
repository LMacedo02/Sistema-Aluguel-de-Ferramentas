<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - AlugaTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-ferramenta { border: none; border-radius: 15px; transition: transform 0.3s; height: 100%; display: flex; flex-direction: column; }
        .card-ferramenta:hover { transform: translateY(-10px ); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .img-container { height: 180px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 15px 15px 0 0; padding: 15px; }
        .price-tag { font-size: 1.2rem; font-weight: 800; color: #2a7ae4; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home"><i class="fas fa-tools me-2"></i>ALUGATECH</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/catalogo">Catálogo</a></li>
                <li class="nav-item">
                    <a class="nav-link position-relative me-3" href="/carrinho">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                              th:if="${session.carrinho != null and !session.carrinho.isEmpty()}"
                              th:text="${session.carrinho.size()}">0</span>
                    </a>
                </li>
                <li class="nav-item" th:if="${#authentication.name == 'anonymousUser'}">
                    <a class="btn btn-outline-light btn-sm ms-2" href="/login"><i class="fas fa-user-circle me-1"></i> Entrar</a>
                </li>
                <li class="nav-item dropdown" th:unless="${#authentication.name == 'anonymousUser'}">
                    <a class="nav-link dropdown-toggle fw-bold" href="#" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle"></i> <span th:text="${#authentication.name}">Usuário</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item text-primary fw-bold" href="/admin/ferramentas">
                                <i class="fas fa-cog me-2"></i>Gerenciar Ferramentas
                            </a>
                        </li>
                        <li><a class="dropdown-item" href="/meus-alugueis">Meus Aluguéis</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><form th:action="@{/logout}" method="post"><button class="dropdown-item text-danger" type="submit">Sair</button></form></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <h2 class="fw-bold mb-4">Catálogo de Ferramentas</h2>
    <div class="row g-4">
        <div class="col-md-4 col-lg-3" th:each="f : ${ferramentas}">
            <div class="card card-ferramenta shadow-sm">
                <div class="img-container"><img th:src="@{${f.imagemUrl}}" class="img-fluid" style="max-height: 100%;"></div>
                <div class="card-body">
                    <h6 class="fw-bold" th:text="${f.nome}"></h6>
                    <p class="card-text text-muted small" th:text="${f.descricao}"></p>
                    <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                        <span class="price-tag">R$ <span th:text="${#numbers.formatDecimal(f.precoDiaria, 1, 'POINT', 2, 'COMMA')}"></span></span>
                        <a th:href="@{/checkout/{id}(id=${f.id})}" class="btn btn-primary btn-sm rounded-pill px-3">Alugar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
