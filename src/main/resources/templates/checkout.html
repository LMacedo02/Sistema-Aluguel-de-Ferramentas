<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout - AlugaTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .checkout-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1 ); }
        .tool-img { max-height: 300px; object-fit: contain; border-radius: 15px; }
    </style>
</head>
<body>

<!-- NAVBAR INTELIGENTE -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home"><i class="fas fa-tools me-2"></i>ALUGATECH</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/catalogo">Catálogo</a></li>
                <li class="nav-item" th:if="${#authentication.name == 'anonymousUser'}">
                    <a class="btn btn-outline-light btn-sm ms-2" href="/login"><i class="fas fa-user-circle me-1"></i> Entrar</a>
                </li>
                <li class="nav-item dropdown" th:unless="${#authentication.name == 'anonymousUser'}">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle"></i> <span th:text="${#authentication.name}"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/meus-alugueis">Meus Aluguéis</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><form th:action="@{/logout}" method="post"><button class="dropdown-item" type="submit">Sair</button></form></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card checkout-card p-4">
                <div class="row g-4">
                    <div class="col-md-6 text-center">
                        <img th:src="@{${ferramenta.imagemUrl}}" class="tool-img img-fluid shadow-sm" alt="Ferramenta">
                    </div>
                    <div class="col-md-6">
                        <h2 class="fw-bold mb-3" th:text="${ferramenta.nome}"></h2>
                        <p class="text-muted mb-4" th:text="${ferramenta.descricao}"></p>
                        
                        <!-- PREÇO COM 2 CASAS DECIMAIS -->
                        <h4 class="text-primary fw-bold mb-4">
                            R$ <span th:text="${#numbers.formatDecimal(ferramenta.precoDiaria, 1, 'POINT', 2, 'COMMA')}"></span> / dia
                        </h4>

                        <form th:action="@{/carrinho/adicionar}" method="post" class="bg-light p-4 rounded-4">
                            <input type="hidden" name="idFerramenta" th:value="${ferramenta.id}">
                            <div class="mb-4">
                                <label class="form-label fw-bold">Por quantos dias deseja alugar?</label>
                                <input type="number" name="dias" class="form-control form-control-lg" value="1" min="1" required>
                                <small class="text-muted mt-2 d-block">* Aluguéis acima de 5 dias ganham 5% de desconto.</small>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" name="acao" value="carrinho" class="btn btn-outline-primary btn-lg fw-bold">Adicionar ao Carrinho</button>
                                <button type="submit" name="acao" value="finalizar" class="btn btn-primary btn-lg fw-bold">Alugar Agora</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
