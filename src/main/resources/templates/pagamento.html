<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pagamento - AlugaTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; padding-top: 50px; }
        .payment-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1 ); padding: 40px; }
        .method-option { border: 2px solid #eee; border-radius: 10px; padding: 15px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .method-option:hover { border-color: #2a7ae4; background-color: #f8fbff; }
        .method-option.active { border-color: #2a7ae4; background-color: #f0f7ff; }
        .total-box { background: #2a7ae4; color: white; border-radius: 10px; padding: 20px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 600px;">
    <!-- ALERTA DE ERRO (Caso algo falhe no banco) -->
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="payment-card">
        <h3 class="fw-bold mb-4 text-center">Forma de Pagamento</h3>
        
        <form th:action="@{/carrinho/pagamento/concluir}" method="post" id="formPagamento">
            
            <div class="method-option" onclick="selectMethod('pix')">
                <input type="radio" name="metodo" value="pix" id="radioPix" required>
                <label class="fw-bold ms-2" for="radioPix">PIX <span class="badge bg-success ms-2">5% OFF</span></label>
                <p class="small text-muted mb-0 ms-4">Aprovação instantânea</p>
            </div>

            <div class="method-option" onclick="selectMethod('cartao')">
                <input type="radio" name="metodo" value="cartao" id="radioCartao">
                <label class="fw-bold ms-2" for="radioCartao">Cartão de Crédito</label>
                <p class="small text-muted mb-0 ms-4">Até 12x sem juros</p>
            </div>

            <div class="method-option" onclick="selectMethod('boleto')">
                <input type="radio" name="metodo" value="boleto" id="radioBoleto">
                <label class="fw-bold ms-2" for="radioBoleto">Boleto Bancário</label>
                <p class="small text-muted mb-0 ms-4">Aprovação em até 2 dias úteis</p>
            </div>

            <div id="camposCartao" class="mt-4 p-3 bg-light rounded" style="display: none;">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Número do Cartão</label>
                    <input type="text" class="form-control" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="row">
                    <div class="col-7">
                        <label class="form-label small fw-bold">Validade</label>
                        <input type="text" class="form-control" placeholder="MM/AA" maxlength="5">
                    </div>
                    <div class="col-5">
                        <label class="form-label small fw-bold">CVV</label>
                        <input type="text" class="form-control" placeholder="000" maxlength="3">
                    </div>
                </div>
            </div>

            <div class="total-box text-center">
                <p class="mb-1 opacity-75">Valor a pagar:</p>
                <h2 class="fw-bold mb-0">R$ <span id="valorFinal" th:text="${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}"></span></h2>
                <small id="msgDesconto" style="display: none;">(Desconto de 5% aplicado!)</small>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 fw-bold py-3">CONCLUIR PEDIDO</button>
            <a href="/carrinho" class="btn btn-link w-100 mt-2 text-muted">Voltar ao carrinho</a>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const totalOriginal = /*[[${total}]]*/ 0;
    function selectMethod(metodo) {
        document.querySelectorAll('.method-option').forEach(el => el.classList.remove('active'));
        document.getElementById('radio' + metodo.charAt(0).toUpperCase() + metodo.slice(1)).checked = true;
        document.querySelector('input[value="'+metodo+'"]').closest('.method-option').classList.add('active');
        document.getElementById('camposCartao').style.display = (metodo === 'cartao') ? 'block' : 'none';
        const valorFinalElement = document.getElementById('valorFinal');
        const msgDesconto = document.getElementById('msgDesconto');
        if (metodo === 'pix') {
            const novoTotal = totalOriginal * 0.95;
            valorFinalElement.innerText = novoTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            msgDesconto.style.display = 'block';
        } else {
            valorFinalElement.innerText = totalOriginal.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            msgDesconto.style.display = 'none';
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
