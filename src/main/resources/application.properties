# Nome da aplica\u00e7\u00e3o
spring.application.name=aluguel-ferramentas

# Porta do servidor (Lembre-se: agora \u00e9 8081!)
server.port=8081

# =========================
# H2 Console
# =========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Isso permite que o console seja acessado mesmo com Spring Security
spring.h2.console.settings.web-allow-others=true

# =========================
# Banco de dados H2 (PERSISTENTE EM ARQUIVO)
# =========================
# O banco ser\u00e1 salvo em uma pasta chamada 'data' no seu projeto
spring.datasource.url=jdbc:h2:file:./data/alugatech
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
